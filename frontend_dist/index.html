<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#2F6B57"/>
  <link rel="icon" type="image/svg+xml" href="/branding/favicon.svg"/>
  <meta name="application-name" content="灵界"/>
  <title>灵界 · 工艺设计工作台</title>
  <script src="/assets/startup-resilience.js"></script>
  <script src="/assets/tool-entry.js"></script>
  <script type="module" crossorigin src="/assets/index-DRoc9wD_.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-9DdLma_o.css">
  <link rel="stylesheet" href="/assets/fee-banner.css">
</head>
<body>
  <aside class="paid-feature-banner paid-feature-banner--conditional" role="note" aria-label="费用提示">
    <strong>费用提示</strong>
    <span id="paid-feature-message">AI 生成或图片修改会调用模型并产生费用；查看、下载和本地处理不收费。</span>
  </aside>
  <a class="standalone-home" href="/" aria-label="返回功能首页">← 返回功能首页</a>
  <div id="root"></div>
  <section id="image3d-panel" class="image3d-panel" aria-labelledby="image3d-title" role="region" tabindex="-1" hidden>
    <header class="image3d-toolbar">
      <div><small>灵界工作台</small><strong id="image3d-title">图生 3D</strong></div>
      <button id="image3d-close" type="button" aria-label="返回工作台">返回工作台</button>
    </header>
    <iframe id="image3d-frame" title="灵界图生 3D" loading="lazy"></iframe>
  </section>
  <section id="text-image-panel" class="text-image-panel" aria-labelledby="text-image-title" role="region" tabindex="-1" hidden>
    <header class="image3d-toolbar">
      <div><small>灵界工作台</small><strong id="text-image-title">文生图</strong></div>
      <button id="text-image-close" type="button" aria-label="返回工作台">返回工作台</button>
    </header>
    <iframe id="text-image-frame" title="灵界文生图" loading="lazy"></iframe>
  </section>
  <style>
    .standalone-home{display:none}
    html[data-standalone-tool="true"] .standalone-home{position:fixed;z-index:20;top:14px;left:18px;display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border:1px solid #dce4df;border-radius:999px;color:#345046;background:#fffffff0;box-shadow:0 5px 18px #1f3e3020;font:700 13px/1 system-ui;text-decoration:none}
    html[data-paid-feature-banner="true"] .standalone-home{top:72px}
    html[data-standalone-tool="true"] .sidebar,html[data-standalone-tool="true"] .topbar{display:none!important}
    html[data-standalone-tool="true"] .main-area,html[data-standalone-tool="true"] .nav-compact .main-area{width:100%!important;margin-left:0!important}
    html[data-standalone-tool="true"] .main-area main{padding-top:72px}
    .image3d-nav-entry b{background:#f1c75b;color:#514216}.image3d-panel[hidden]{display:none}.image3d-panel{position:fixed;z-index:9;right:0;bottom:0;display:grid;grid-template-rows:auto 1fr;overflow:hidden;border-left:1px solid #dce4df;background:#f2f5f1}.image3d-toolbar{display:flex;align-items:center;justify-content:space-between;padding:13px 17px;border-bottom:1px solid #dce4df;background:#fff}.image3d-toolbar div{display:grid;gap:2px}.image3d-toolbar small{color:#738079;font:600 11px/1.2 system-ui}.image3d-toolbar strong{color:#26342d;font:800 16px/1.2 system-ui}.image3d-toolbar button{padding:9px 13px;border:0;border-radius:10px;background:#edf2ef;color:#345046;font:700 13px/1 system-ui;cursor:pointer}.image3d-toolbar button:hover{background:#dfe9e4}.image3d-panel iframe{width:100%;height:100%;border:0;background:#f2f5f1}.image3d-nav-entry.image3d-active{color:#204e3e;background:#e6eee5;font-weight:650}@media(max-width:700px){.image3d-panel{inset:0!important;border-left:0}.image3d-toolbar{padding:10px 13px}}
    .text-image-nav-entry b{background:#dcebe3;color:#285b48}.text-image-panel[hidden]{display:none}.text-image-panel{position:fixed;z-index:9;right:0;bottom:0;display:grid;grid-template-rows:auto 1fr;overflow:hidden;border-left:1px solid #dce4df;background:#f2f5f1}.text-image-panel iframe{width:100%;height:100%;border:0;background:#f2f5f1}.text-image-nav-entry.text-image-active{color:#204e3e;background:#e6eee5;font-weight:650}@media(max-width:700px){.text-image-panel{inset:0!important;border-left:0}}
    @media (min-width: 951px) {
      .sidebar {
        min-height: 0;
        overflow-x: hidden;
        overflow-y: auto;
      }
      .sidebar nav {
        flex: 1 0 180px;
        min-height: 180px;
        min-width: 0;
        overflow-x: hidden;
        overflow-y: auto;
        scrollbar-gutter: stable;
      }
      .sidebar nav button,
      .sidebar nav .image3d-nav-entry,
      .sidebar nav .text-image-nav-entry {
        flex-shrink: 0;
        width: 100%;
        min-width: 0;
        min-height: 42px;
      }
      .sidebar-bottom {
        flex: 0 0 auto;
        margin-top: 16px;
      }
      .workspace-chip,
      .workspace-chip > div {
        min-width: 0;
      }
    }
    @media (min-width: 951px) and (max-width: 1200px) {
      .sidebar {
        width: 205px;
      }
      .main-area,
      .nav-compact .main-area {
        width: calc(100% - 205px);
        margin-left: 205px;
      }
      .workspace-chip strong,
      .workspace-chip small {
        font-size: 13px;
      }
    }
    @media(max-width:700px){html[data-paid-feature-banner="true"] .standalone-home{top:94px}}
  </style>
  <script>
    (() => {
      if (document.documentElement.dataset.standaloneTool === 'true') return;
      const panel = document.getElementById('image3d-panel');
      const frame = document.getElementById('image3d-frame');
      const close = document.getElementById('image3d-close');
      const textPanel = document.getElementById('text-image-panel');
      const textFrame = document.getElementById('text-image-frame');
      const textClose = document.getElementById('text-image-close');
      const placePanel = target => {
        const sidebar = document.querySelector('aside.sidebar');
        if (!sidebar || target.hidden) return;
        const rect = sidebar.getBoundingClientRect();
        const horizontal = getComputedStyle(sidebar).position === 'fixed';
        target.style.left = horizontal ? `${Math.max(0, rect.right)}px` : '0';
        target.style.top = horizontal ? '0' : `${Math.max(0, rect.bottom)}px`;
      };
      const place = () => { placePanel(panel); placePanel(textPanel); };
      const open = () => {
        textPanel.hidden = true;
        textEntry.classList.remove('text-image-active');
        if (!frame.dataset.loaded) {
          frame.src = '/image-to-3d?embedded=1';
          frame.dataset.loaded = '1';
        }
        panel.hidden = false;
        entry.classList.add('image3d-active');
        document.body.style.overflow = 'hidden';
        place();
        panel.focus();
      };
      const dismiss = () => {
        panel.hidden = true;
        entry.classList.remove('image3d-active');
        document.body.style.overflow = '';
        entry.focus();
      };
      const openText = () => {
        panel.hidden = true;
        entry.classList.remove('image3d-active');
        if (!textFrame.dataset.loaded) {
          textFrame.src = '/text-to-image?embedded=1';
          textFrame.dataset.loaded = '1';
        }
        textPanel.hidden = false;
        textEntry.classList.add('text-image-active');
        document.body.style.overflow = 'hidden';
        place();
        textPanel.focus();
      };
      const dismissText = () => {
        textPanel.hidden = true;
        textEntry.classList.remove('text-image-active');
        document.body.style.overflow = '';
        textEntry.focus();
      };
      const entry = document.createElement('button');
      entry.type = 'button';
      entry.className = 'image3d-nav-entry';
      entry.dataset.image3dEntry = 'true';
      entry.innerHTML = '<svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9L12 3Z"/><path d="m4.3 7.7 7.7 4.4 7.7-4.4M12 12v9"/></svg><span>图生 3D</span><b>NEW</b>';
      entry.addEventListener('click', open);
      const textEntry = document.createElement('button');
      textEntry.type = 'button';
      textEntry.className = 'text-image-nav-entry';
      textEntry.dataset.textImageEntry = 'true';
      textEntry.innerHTML = '<svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 15-5-5L5 20"/></svg><span>文生图</span><b>NEW</b>';
      textEntry.addEventListener('click', openText);
      const redirectsToTextImage = button => {
        const label = button?.textContent?.replace(/\s+/g, ' ').trim() || '';
        return ['创意工作室', '视觉工作室', '创建新产品', '制作展示图'].some(name => label.includes(name));
      };
      const attach = () => {
        const navigation = document.querySelector('aside.sidebar > nav');
        if (navigation && !textEntry.isConnected) {
          navigation.insertBefore(textEntry, navigation.children[1] || null);
        }
        if (navigation && !entry.isConnected) {
          navigation.insertBefore(entry, textEntry.nextSibling);
        }
        if (navigation && !navigation.dataset.textImageRedirect) {
          navigation.dataset.textImageRedirect = 'true';
          navigation.addEventListener('click', event => {
            const button = event.target.closest?.('button');
            if (!redirectsToTextImage(button)) return;
            event.preventDefault();
            event.stopPropagation();
            openText();
          }, true);
        }
      };
      new MutationObserver(attach).observe(document.getElementById('root'), {childList:true, subtree:true});
      attach();
      close.addEventListener('click', dismiss);
      textClose.addEventListener('click', dismissText);
      document.getElementById('root').addEventListener('click', event => {
        const button = event.target.closest?.('button');
        if (!redirectsToTextImage(button)) return;
        event.preventDefault();
        event.stopPropagation();
        openText();
      }, true);
      window.addEventListener('resize', place);
      new MutationObserver(place).observe(document.body, {attributes:true, attributeFilter:['class']});
      document.addEventListener('keydown', event => {
        if (event.key !== 'Escape') return;
        if (!panel.hidden) dismiss();
        else if (!textPanel.hidden) dismissText();
      });
    })();
  </script>
</body>
</html>
