<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#2F6B57"/>
  <link rel="icon" type="image/svg+xml" href="/branding/favicon.svg"/>
  <meta name="application-name" content="灵界"/>
  <title>灵界 · 工艺设计工作台</title>
  <script type="module" crossorigin src="/assets/index-DRoc9wD_.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-9DdLma_o.css">
</head>
<body>
  <div id="root"></div>
  <div id="image3d-modal" class="image3d-modal" role="dialog" aria-modal="true" aria-labelledby="image3d-title" hidden>
    <div class="image3d-window">
      <header class="image3d-toolbar">
        <div><small>灵界工作台</small><strong id="image3d-title">图生 3D</strong></div>
        <button id="image3d-close" type="button" aria-label="关闭图生 3D">×</button>
      </header>
      <iframe id="image3d-frame" title="灵界图生 3D" loading="lazy"></iframe>
    </div>
  </div>
  <style>
    .image3d-nav-entry b{background:#f1c75b;color:#514216}.image3d-modal[hidden]{display:none}.image3d-modal{position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;padding:20px;background:rgba(20,35,28,.52);backdrop-filter:blur(8px)}.image3d-window{width:min(1180px,100%);height:min(900px,calc(100vh - 40px));display:grid;grid-template-rows:auto 1fr;overflow:hidden;border:1px solid rgba(47,107,87,.22);border-radius:18px;background:#f2f5f1;box-shadow:0 28px 90px rgba(12,35,26,.32)}.image3d-toolbar{display:flex;align-items:center;justify-content:space-between;padding:13px 17px;border-bottom:1px solid #dce4df;background:#fff}.image3d-toolbar div{display:grid;gap:2px}.image3d-toolbar small{color:#738079;font:600 11px/1.2 system-ui}.image3d-toolbar strong{color:#26342d;font:800 16px/1.2 system-ui}.image3d-toolbar button{width:34px;height:34px;padding:0;border:0;border-radius:10px;background:#edf2ef;color:#345046;font:500 24px/1 system-ui;cursor:pointer}.image3d-toolbar button:hover{background:#dfe9e4}.image3d-window iframe{width:100%;height:100%;border:0;background:#f2f5f1}@media(max-width:720px){.image3d-modal{padding:0}.image3d-window{width:100%;height:100vh;border:0;border-radius:0}}
  </style>
  <script>
    (() => {
      const modal = document.getElementById('image3d-modal');
      const frame = document.getElementById('image3d-frame');
      const close = document.getElementById('image3d-close');
      const open = () => {
        if (!frame.dataset.loaded) {
          frame.src = '/image-to-3d?embedded=1';
          frame.dataset.loaded = '1';
        }
        modal.hidden = false;
        document.body.style.overflow = 'hidden';
        close.focus();
      };
      const dismiss = () => {
        modal.hidden = true;
        document.body.style.overflow = '';
        entry.focus();
      };
      const entry = document.createElement('button');
      entry.type = 'button';
      entry.className = 'image3d-nav-entry';
      entry.dataset.image3dEntry = 'true';
      entry.innerHTML = '<svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9L12 3Z"/><path d="m4.3 7.7 7.7 4.4 7.7-4.4M12 12v9"/></svg><span>图生 3D</span><b>NEW</b>';
      entry.addEventListener('click', open);
      const attach = () => {
        const navigation = document.querySelector('aside.sidebar > nav');
        if (navigation && !entry.isConnected) {
          navigation.insertBefore(entry, navigation.children[1] || null);
        }
      };
      new MutationObserver(attach).observe(document.getElementById('root'), {childList:true, subtree:true});
      attach();
      close.addEventListener('click', dismiss);
      modal.addEventListener('click', event => { if (event.target === modal) dismiss(); });
      document.addEventListener('keydown', event => { if (event.key === 'Escape' && !modal.hidden) dismiss(); });
    })();
  </script>
</body>
</html>
