<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#2F6B57"/>
  <link rel="icon" type="image/svg+xml" href="/branding/favicon.svg"/>
  <meta name="application-name" content="灵界"/>
  <title>灵界 · 工艺设计工作台</title>
  <script type="module" crossorigin src="/assets/index-DRoc9wD_.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-9DdLma_o.css">
</head>
<body>
  <div id="root"></div>
  <section id="image3d-panel" class="image3d-panel" aria-labelledby="image3d-title" role="region" tabindex="-1" hidden>
    <header class="image3d-toolbar">
      <div><small>灵界工作台</small><strong id="image3d-title">图生 3D</strong></div>
      <button id="image3d-close" type="button" aria-label="返回工作台">返回工作台</button>
    </header>
    <iframe id="image3d-frame" title="灵界图生 3D" loading="lazy"></iframe>
  </section>
  <style>
    .image3d-nav-entry b{background:#f1c75b;color:#514216}.image3d-panel[hidden]{display:none}.image3d-panel{position:fixed;z-index:9;right:0;bottom:0;display:grid;grid-template-rows:auto 1fr;overflow:hidden;border-left:1px solid #dce4df;background:#f2f5f1}.image3d-toolbar{display:flex;align-items:center;justify-content:space-between;padding:13px 17px;border-bottom:1px solid #dce4df;background:#fff}.image3d-toolbar div{display:grid;gap:2px}.image3d-toolbar small{color:#738079;font:600 11px/1.2 system-ui}.image3d-toolbar strong{color:#26342d;font:800 16px/1.2 system-ui}.image3d-toolbar button{padding:9px 13px;border:0;border-radius:10px;background:#edf2ef;color:#345046;font:700 13px/1 system-ui;cursor:pointer}.image3d-toolbar button:hover{background:#dfe9e4}.image3d-panel iframe{width:100%;height:100%;border:0;background:#f2f5f1}.image3d-nav-entry.image3d-active{color:#204e3e;background:#e6eee5;font-weight:650}@media(max-width:700px){.image3d-panel{inset:0!important;border-left:0}.image3d-toolbar{padding:10px 13px}}
  </style>
  <script>
    (() => {
      const panel = document.getElementById('image3d-panel');
      const frame = document.getElementById('image3d-frame');
      const close = document.getElementById('image3d-close');
      const place = () => {
        const sidebar = document.querySelector('aside.sidebar');
        if (!sidebar || panel.hidden) return;
        const rect = sidebar.getBoundingClientRect();
        const horizontal = getComputedStyle(sidebar).position === 'fixed';
        panel.style.left = horizontal ? `${Math.max(0, rect.right)}px` : '0';
        panel.style.top = horizontal ? '0' : `${Math.max(0, rect.bottom)}px`;
      };
      const open = () => {
        if (!frame.dataset.loaded) {
          frame.src = '/image-to-3d?embedded=1';
          frame.dataset.loaded = '1';
        }
        panel.hidden = false;
        entry.classList.add('image3d-active');
        document.body.style.overflow = 'hidden';
        place();
        panel.focus();
      };
      const dismiss = () => {
        panel.hidden = true;
        entry.classList.remove('image3d-active');
        document.body.style.overflow = '';
        entry.focus();
      };
      const entry = document.createElement('button');
      entry.type = 'button';
      entry.className = 'image3d-nav-entry';
      entry.dataset.image3dEntry = 'true';
      entry.innerHTML = '<svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9L12 3Z"/><path d="m4.3 7.7 7.7 4.4 7.7-4.4M12 12v9"/></svg><span>图生 3D</span><b>NEW</b>';
      entry.addEventListener('click', open);
      const attach = () => {
        const navigation = document.querySelector('aside.sidebar > nav');
        if (navigation && !entry.isConnected) {
          navigation.insertBefore(entry, navigation.children[1] || null);
        }
      };
      new MutationObserver(attach).observe(document.getElementById('root'), {childList:true, subtree:true});
      attach();
      close.addEventListener('click', dismiss);
      window.addEventListener('resize', place);
      new MutationObserver(place).observe(document.body, {attributes:true, attributeFilter:['class']});
      document.addEventListener('keydown', event => { if (event.key === 'Escape' && !panel.hidden) dismiss(); });
    })();
  </script>
</body>
</html>
